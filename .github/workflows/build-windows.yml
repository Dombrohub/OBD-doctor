name: Build Windows app

# Every push to main builds and tests the Windows app.
# If the version in obd_doctor/__init__.py has no release yet, it also publishes one
# (tag vX.Y.Z, created here by GitHub) with the installer, its checksum and the portable zip.
# Installed copies of OBD EFT find new releases automatically.
#
# To release a new version: bump the version numbers (obd_doctor/__init__.py,
# installer/obd_doctor.nsi, version_info.txt) and push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # needed to create releases and their tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path obd_doctor/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { "exists=true" >> $env:GITHUB_OUTPUT } else { "exists=false" >> $env:GITHUB_OUTPUT }
          exit 0
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller pyserial anthropic
      - run: python -m PyInstaller --noconfirm --clean obd_doctor.spec

      - name: Smoke test (CLI against the built-in simulator)
        run: |
          dist\OBDEFT\obd-eft-cli.exe --version
          dist\OBDEFT\obd-eft-cli.exe scan --port demo --no-save
          $out = dist\OBDEFT\obd-eft-cli.exe lookup P2187 | Out-String
          if ($out -notmatch "Lean at Idle") { Write-Error "trouble-code database missing from the build"; exit 1 }

      - name: Install NSIS (installer builder) if missing
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis -y --no-progress }

      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\NSIS\makensis.exe" installer\obd_doctor.nsi' 

      - name: Portable zip and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path dist\OBDEFT -DestinationPath dist\OBDEFT-portable.zip
          $h = (Get-FileHash dist\OBDEFT-Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$h  OBDEFT-Setup.exe" | Out-File -Encoding ascii dist\OBDEFT-Setup.exe.sha256
          # Copies under the app's old name, so copies installed as "OBD Doctor" can still update
          Copy-Item dist\OBDEFT-Setup.exe dist\OBDDoctor-Setup.exe
          Copy-Item dist\OBDEFT-portable.zip dist\OBDDoctor-portable.zip
          "$h  OBDDoctor-Setup.exe" | Out-File -Encoding ascii dist\OBDDoctor-Setup.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: OBDEFT-${{ steps.version.outputs.version }}-windows
          path: |
            dist/OBDEFT-Setup.exe
            dist/OBDEFT-Setup.exe.sha256
            dist/OBDEFT-portable.zip

      - name: Publish release
        if: steps.version.outputs.exists == 'false' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: OBD EFT ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/OBDEFT-Setup.exe
            dist/OBDEFT-Setup.exe.sha256
            dist/OBDEFT-portable.zip
            dist/OBDDoctor-Setup.exe
            dist/OBDDoctor-Setup.exe.sha256
            dist/OBDDoctor-portable.zip
