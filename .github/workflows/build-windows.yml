name: Build Windows app

# Every push to main builds and tests the Windows app.
# If the version in obd_doctor/__init__.py has no release yet, it also publishes one
# (tag vX.Y.Z, created here by GitHub) with the installer, its checksum and the portable zip.
# Installed copies of OBD Doctor find new releases automatically.
#
# To release a new version: bump the version numbers (obd_doctor/__init__.py,
# installer/obd_doctor.nsi, version_info.txt) and push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # needed to create releases and their tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path obd_doctor/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { "exists=true" >> $env:GITHUB_OUTPUT } else { "exists=false" >> $env:GITHUB_OUTPUT }
          exit 0
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller pyserial anthropic
      - run: python -m PyInstaller --noconfirm --clean obd_doctor.spec

      - name: Smoke test (CLI against the built-in simulator)
        run: |
          dist\OBDDoctor\obd-doctor-cli.exe --version
          dist\OBDDoctor\obd-doctor-cli.exe scan --port demo --no-save

      - name: Build installer (NSIS is preinstalled on GitHub's Windows runners)
        run: makensis installer\obd_doctor.nsi

      - name: Portable zip and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path dist\OBDDoctor -DestinationPath dist\OBDDoctor-portable.zip
          $h = (Get-FileHash dist\OBDDoctor-Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$h  OBDDoctor-Setup.exe" | Out-File -Encoding ascii dist\OBDDoctor-Setup.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: OBDDoctor-${{ steps.version.outputs.version }}-windows
          path: |
            dist/OBDDoctor-Setup.exe
            dist/OBDDoctor-Setup.exe.sha256
            dist/OBDDoctor-portable.zip

      - name: Publish release
        if: steps.version.outputs.exists == 'false' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: OBD Doctor ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/OBDDoctor-Setup.exe
            dist/OBDDoctor-Setup.exe.sha256
            dist/OBDDoctor-portable.zip
