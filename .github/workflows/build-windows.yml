name: Build Windows app

# Push a version tag (e.g. "git tag v1.8.0 && git push origin v1.8.0") to build the app and
# publish a GitHub Release. Installed copies of OBD Doctor find new releases automatically.
# "Run workflow" on the Actions tab builds without publishing (files appear as a build artifact).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write  # needed to create releases

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller pyserial anthropic
      - run: python -m PyInstaller --noconfirm --clean obd_doctor.spec
      - name: Smoke test (CLI against the built-in simulator)
        run: dist\OBDDoctor\obd-doctor-cli.exe scan --port demo --no-save
      - name: Build installer (NSIS is preinstalled on GitHub's Windows runners)
        run: makensis installer\obd_doctor.nsi
      - name: Portable zip and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path dist\OBDDoctor -DestinationPath dist\OBDDoctor-portable.zip
          $h = (Get-FileHash dist\OBDDoctor-Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$h  OBDDoctor-Setup.exe" | Out-File -Encoding ascii dist\OBDDoctor-Setup.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: OBDDoctor-windows
          path: |
            dist/OBDDoctor-Setup.exe
            dist/OBDDoctor-Setup.exe.sha256
            dist/OBDDoctor-portable.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/OBDDoctor-Setup.exe
            dist/OBDDoctor-Setup.exe.sha256
            dist/OBDDoctor-portable.zip
